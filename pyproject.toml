[project]
name = "skynt"
version = "1.0.0"
description = "Policy gateway for MCP: your AI works freely, you stay in control"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Henrique Martins" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.0"]

[project.scripts]
skynt = "skynt.__main__:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skynt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
