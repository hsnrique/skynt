# A hand-written policy for a database agent. Start from `skynt init` for the presets.
default = "deny"
audit_log = "skynt-audit.jsonl"

[[rules]]
match = ["list_*", "describe_*", "get_*"]
action = "allow"

# A tripwire, not a wall: pair it with a read-only database role.
[[rules]]
match = "execute_sql"
action = "allow"
deny_if_args_match = '(?i)\b(drop|truncate|delete|alter|grant)\b'

[[rules]]
match = ["apply_migration", "*branch*"]
action = "confirm"
